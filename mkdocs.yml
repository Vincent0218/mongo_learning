site_name: MongoDB 實戰升級指南
site_description: 由淺入深的 MongoDB 核心技術與架構實戰全攻略
site_author: Antigravity Pair Programmer
copyright: Copyright &copy; 2026
watch:
  - examples

theme:
  name: material
  custom_dir: overrides
  language: zh-Hant
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # 亮色模式
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切換至深色模式
    # 深色模式
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切換至亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - 首頁總覽: index.md
  - 實作環境與驗證:
      - 實作環境與資料合約: lab.md
      - 測試與驗證紀錄: verification.md
  - 核心基礎:
      - 核心觀念與環境架設: 01-basics.md
      - 核心 CRUD 與進階查詢: 02-crud.md
  - 查詢與分析:
      - 聚合管道 Aggregation: 03-aggregation.md
      - 索引架構與效能調校: 04-indexing.md
      - 全文、子字串與向量搜尋: 04-atlas-search.md
  - 應用與實戰:
      - 資料模型設計思維: 05-data-modeling.md
      - Python 實戰整合: 06-python-integration.md
      - .NET (C#) 實戰整合: 06-dotnet-integration.md
      - Golang 實戰整合: 06-golang-integration.md
  - 生產維運:
      - 叢集架構與高可用: 07-architecture.md
  - 附錄速查:
      - 高頻語法與指令速查表: cheatsheet.md
      - 經典錯誤排查與 FAQ: troubleshooting.md

