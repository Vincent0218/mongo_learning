site_name: MongoDB 實戰升級指南
site_description: 由淺入深的 MongoDB 核心技術與架構實戰全攻略
site_author: Antigravity Pair Programmer
copyright: Copyright &copy; 2026

theme:
  name: material
  language: zh-Hant
  palette:
    # 亮色模式
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切換至深色模式
    # 深色模式
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切換至亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - 首頁總覽: index.md
  - 基礎入門:
      - Level 1 觀念與環境架設: 01-basics.md
      - Level 2 核心 CRUD 操作: 02-crud.md
  - 進階調校:
      - Level 3 聚合管道 Aggregation: 03-aggregation.md
      - Level 4 索引與效能調校: 04-indexing.md
  - 架構設計:
      - Level 5 資料模型設計思維: 05-data-modeling.md
      - Level 7 叢集架構與高可用: 07-architecture.md
  - 實戰開發:
      - Level 6 Python 實戰整合: 06-python-integration.md
      - Level 6 .NET (C#) 實戰整合: 06-dotnet-integration.md
